<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Mestre Códigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06000f;color:#fff;font-family:Raleway,sans-serif;padding:20px}
    .box{width:100%;max-width:420px;background:linear-gradient(135deg,rgba(19,0,41,.96),rgba(26,0,53,.96));border:1px solid rgba(245,158,11,.35);border-radius:22px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
    h1{margin:0 0 10px;font-family:Cinzel,serif;font-size:1.9rem;background:linear-gradient(135deg,#fcd34d,#f59e0b,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{color:#c4b5fd;margin:0 0 20px}.label{display:block;font-size:.84rem;color:#c4b5fd;margin:0 0 8px}.input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(168,85,247,.25);background:rgba(59,7,100,.2);color:#fff;outline:none;margin-bottom:14px}.input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.15)}
    .btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#6d28d9,#3b0764);color:#fff;font-family:Cinzel,serif;font-weight:700;cursor:pointer}
    .msg{display:none;margin-top:14px;padding:14px;border-radius:12px}.err{display:block;background:rgba(127,29,29,.35);border:1px solid rgba(248,113,113,.35);color:#fecaca}.ok{display:block;background:rgba(20,83,45,.35);border:1px solid rgba(74,222,128,.35);color:#bbf7d0}
    .muted{margin-top:12px;font-size:.82rem;color:#c4b5fd;text-align:center}
  </style>
</head>
<body>
  <div class="box">
    <h1>Mestre Códigos</h1>
    <p>Entre para acessar os códigos e a loja com Pix.</p>
    <label class="label">Usuário</label>
    <input class="input" id="username" placeholder="Seu usuário" autocomplete="username">
    <label class="label">Senha</label>
    <input class="input" id="password" type="password" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
    <button class="btn" id="btn" onclick="login()">Entrar</button>
    <div class="msg" id="msg"></div>
    <div class="muted">Usuário padrão: admin • Senha padrão: admin123</div>
  </div>
  <script>
    function show(type,text){const el=document.getElementById('msg'); el.className='msg '+type; el.textContent=text}
    async function login(){
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      const btn=document.getElementById('btn');
      btn.disabled=true; btn.textContent='Entrando...';
      try{
        const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
        const data=await res.json();
        if(data.success){ show('ok','Login realizado com sucesso.'); setTimeout(()=>location.href=data.redirect||'/',400); }
        else show('err',data.message||'Falha no login.');
      }catch(e){ show('err','Erro de conexão.'); }
      finally{ btn.disabled=false; btn.textContent='Entrar'; }
    }
  </script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4edd5f8ec12a48cfa682ab8261b80a79","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
