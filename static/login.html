<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central dos Códigos ✦ — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;600;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;600;700&display=swap"/></noscript>
  <style>
    :root {
      --bg-deep:#06000f; --bg-dark:#0d0020; --bg-card:#130029;
      --purple-deep:#3b0764; --purple-mid:#6d28d9; --purple-bright:#a855f7;
      --gold:#f59e0b; --gold-light:#fcd34d;
      --text-white:#f5f0ff; --text-muted:#c4b5fd;
      --border:rgba(168,85,247,0.25); --border-gold:rgba(245,158,11,0.35);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg-deep);color:var(--text-white);font-family:'Raleway',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;}
    .mist{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.12;z-index:0;pointer-events:none;}
    .m1{width:600px;height:600px;background:var(--purple-mid);top:-150px;left:-150px;}
    .m2{width:500px;height:500px;background:var(--gold);bottom:-100px;right:-100px;}
    .card{
      position:relative;z-index:1;
      background:linear-gradient(135deg,rgba(19,0,41,0.95),rgba(26,0,53,0.9));
      border:1px solid var(--border-gold);
      border-radius:20px;padding:48px 40px;width:100%;max-width:420px;
      box-shadow:0 0 60px rgba(109,40,217,0.3),0 0 120px rgba(245,158,11,0.1);
    }
    .logo{text-align:center;margin-bottom:32px;}
    .logo-icon{
      width:80px;height:80px;margin:0 auto 16px;
      background:linear-gradient(135deg,var(--purple-deep),var(--purple-mid));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:36px;border:2px solid var(--border-gold);
      box-shadow:0 0 30px rgba(109,40,217,0.5);
    }
    h1{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;
      background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--purple-bright));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-align:center;letter-spacing:0.08em;}
    .subtitle{text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:6px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:0.8rem;font-weight:600;color:var(--text-muted);
      letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
    input{
      width:100%;padding:13px 16px;
      background:rgba(109,40,217,0.1);border:1px solid var(--border);
      border-radius:10px;color:var(--text-white);font-family:'Raleway',sans-serif;font-size:1rem;
      outline:none;transition:border-color .2s,box-shadow .2s;
    }
    input:focus{border-color:var(--purple-bright);box-shadow:0 0 15px rgba(168,85,247,0.3);}
    input::placeholder{color:rgba(196,181,253,0.4);}
    .btn{
      width:100%;padding:14px;margin-top:8px;
      background:linear-gradient(135deg,var(--purple-deep),var(--purple-mid),var(--purple-bright));
      background-size:200% auto;
      border:none;border-radius:10px;color:#fff;
      font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:0.1em;
      cursor:pointer;transition:all .3s;
      box-shadow:0 4px 20px rgba(109,40,217,0.4);
    }
    .btn:hover{background-position:right center;box-shadow:0 6px 30px rgba(109,40,217,0.6);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;}
    .error-msg{
      display:none;margin-top:16px;padding:12px 16px;
      background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.4);
      border-radius:8px;color:#fca5a5;font-size:0.88rem;text-align:center;
    }
    .spinner{
      display:inline-block;width:16px;height:16px;
      border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:8px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .footer-txt{text-align:center;margin-top:24px;color:var(--text-muted);font-size:0.78rem;}
  </style>
</head>
<body>
  <div class="mist m1"></div>
  <div class="mist m2"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1 id="site-title-h1">CENTRAL DOS CÓDIGOS</h1>
      <p class="subtitle">Acesso restrito — faça login para continuar</p>
    </div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">👤 Usuário</label>
        <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">🔒 Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn" id="btn-login">✦ Entrar</button>
    </form>
    <div class="error-msg" id="error-msg"></div>
    <p class="footer-txt">✦ Plataforma exclusiva ✦</p>
  </div>
  <script>
    // ── NOME E IMAGENS DINÂMICAS BASEADOS NO DOMÍNIO ──
    (function() {
      const host = (window.location.hostname || '').toLowerCase();
      const isRios = host.startsWith('rios.') || host.includes('rios.up.railway.app');
      if (isRios) {
        // 1) Injeta CSS customizado tema RIO
        const style = document.createElement('style');
        style.textContent = `
          /* Tema RIO — vermelho/dourado, somente para rios.up.railway.app */
          body { background-color:#0a0000 !important; }
          .card {
            background: linear-gradient(135deg, rgba(30,5,5,0.95), rgba(50,10,10,0.92)) !important;
            border: 1.5px solid rgba(220,38,38,0.55) !important;
            box-shadow: 0 0 60px rgba(220,38,38,0.35), 0 0 120px rgba(245,158,11,0.12), inset 0 0 30px rgba(220,38,38,0.05) !important;
          }
          h1#site-title-h1 {
            background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 30%, #dc2626 70%, #fcd34d 100%) !important;
            background-size: 200% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: rio-shimmer 3s linear infinite;
            text-shadow: 0 0 40px rgba(220,38,38,0.4);
          }
          @keyframes rio-shimmer { to { background-position: 200% center; } }

          .subtitle { color: #fca5a5 !important; }

          /* Labels com ícone vermelho */
          label {
            color: #fcd34d !important;
            font-weight: 700 !important;
            letter-spacing: 0.12em !important;
            text-shadow: 0 1px 4px rgba(220,38,38,0.3);
          }

          /* Inputs estilo RIO — borda vermelha + glow dourado no foco */
          .form-group { position: relative; }
          .form-group input {
            background: rgba(20,5,5,0.85) !important;
            border: 1.5px solid rgba(220,38,38,0.4) !important;
            color: #fef3c7 !important;
            padding: 14px 16px 14px 46px !important;
            font-size: 1.02rem !important;
            font-weight: 500 !important;
            border-radius: 12px !important;
            transition: all .28s ease !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
          }
          .form-group input::placeholder { color: rgba(252,165,165,0.55) !important; font-style: italic; }
          .form-group input:focus {
            border-color: #fcd34d !important;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.25), 0 0 25px rgba(245,158,11,0.35), inset 0 0 10px rgba(220,38,38,0.15) !important;
            background: rgba(30,8,8,0.95) !important;
            outline: none !important;
          }
          /* Ícone dentro do input (esquerda) */
          .rio-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 14px;
            font-size: 1.15rem;
            color: #dc2626;
            text-shadow: 0 0 8px rgba(220,38,38,0.6);
            pointer-events: none;
            transition: all .25s;
            z-index: 2;
          }
          .form-group input:focus + .rio-input-icon,
          .form-group:focus-within .rio-input-icon {
            color: #fcd34d;
            text-shadow: 0 0 12px rgba(245,158,11,0.8);
            transform: translateY(-50%) scale(1.12);
          }

          /* Botão estilo "assalto" RIO */
          .btn {
            background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 35%, #f59e0b 70%, #dc2626 100%) !important;
            background-size: 250% auto !important;
            border: 1.5px solid rgba(252,211,77,0.65) !important;
            color: #fff8e7 !important;
            font-weight: 900 !important;
            letter-spacing: 0.18em !important;
            text-transform: uppercase !important;
            font-size: 1.05rem !important;
            padding: 16px !important;
            margin-top: 14px !important;
            border-radius: 12px !important;
            box-shadow: 0 6px 25px rgba(220,38,38,0.5), 0 0 40px rgba(245,158,11,0.2), inset 0 1px 0 rgba(255,255,255,0.2) !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 12px rgba(220,38,38,0.4);
            transition: all .35s ease !important;
            position: relative;
            overflow: hidden;
          }
          .btn:hover {
            background-position: right center !important;
            box-shadow: 0 8px 35px rgba(220,38,38,0.7), 0 0 60px rgba(245,158,11,0.4), inset 0 1px 0 rgba(255,255,255,0.3) !important;
            transform: translateY(-1px);
            border-color: #fcd34d !important;
          }
          .btn:active { transform: translateY(0); }

          /* Logo icon ja com imagem do Rio — ajusta borda/sombra */
          .logo-icon {
            border: 2.5px solid #fcd34d !important;
            box-shadow: 0 0 35px rgba(220,38,38,0.7), 0 0 70px rgba(245,158,11,0.35), inset 0 0 0 3px #0a0000 !important;
          }

          .footer-txt { color: rgba(252,211,77,0.6) !important; letter-spacing: 0.15em !important; }
          .error-msg {
            background: rgba(220,38,38,0.2) !important;
            border: 1px solid rgba(220,38,38,0.6) !important;
            color: #fca5a5 !important;
          }

          @media (max-width: 480px) {
            .form-group input { padding-left: 44px !important; }
            .rio-input-icon { left: 12px; font-size: 1.05rem; }
          }
        `;
        document.head.appendChild(style);

        // 2) Define título e abas
        const h1 = document.getElementById('site-title-h1');
        if (h1) h1.textContent = 'RIO CÓDIGOS';
        document.title = 'Rio Códigos ✦ — Login';

        // 3) Aplica banner como fundo do body (efeito cinema)
        document.body.style.backgroundImage = "linear-gradient(rgba(10,0,0,0.86), rgba(10,0,0,0.94)), url('/static/rio-bg.jpg')";
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';

        // 4) Substitui o ícone ✦ pela imagem redonda do personagem
        const logoIcon = document.querySelector('.logo-icon');
        if (logoIcon) {
          logoIcon.style.background = "url('/static/rio-icon.jpg') center/cover";
          logoIcon.textContent = '';
        }

        // 5) Adiciona ícones SVG/emoji dentro de cada input
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        if (userInput && !userInput.parentNode.querySelector('.rio-input-icon')) {
          // Limpa o emoji do label e injeta ícone no input
          const userLabel = document.querySelector('label[for="username"]');
          if (userLabel) userLabel.textContent = 'Usuário';
          const ic = document.createElement('span');
          ic.className = 'rio-input-icon';
          ic.textContent = '🎭';
          userInput.parentNode.appendChild(ic);
          userInput.placeholder = 'Digite seu usuário';
        }
        if (passInput && !passInput.parentNode.querySelector('.rio-input-icon')) {
          const passLabel = document.querySelector('label[for="password"]');
          if (passLabel) passLabel.textContent = 'Senha';
          const ic = document.createElement('span');
          ic.className = 'rio-input-icon';
          ic.textContent = '🔑';
          passInput.parentNode.appendChild(ic);
          passInput.placeholder = 'Digite sua senha';
        }

        // 6) Botão entrar com ícone de cofre/máscara
        const btn = document.getElementById('btn-login');
        if (btn) btn.innerHTML = '🎭 Entrar no Cofre';

        // 7) Adiciona banner pequeno acima do card — envolvendo em wrapper centralizado
        const card = document.querySelector('.card');
        if (card && !document.getElementById('rio-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'rio-wrapper';
          wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;margin:0 auto;position:relative;z-index:1;';
          const banner = document.createElement('div');
          banner.id = 'rio-banner';
          banner.style.cssText = 'width:100%;margin:0 0 14px 0;border-radius:14px;overflow:hidden;border:1px solid rgba(245,158,11,0.4);box-shadow:0 0 30px rgba(220,38,38,0.4);';
          banner.innerHTML = '<img src="/static/rio-banner-1200.jpg" alt="RIO" style="width:100%;display:block"/>';
          card.parentNode.insertBefore(wrapper, card);
          wrapper.appendChild(banner);
          wrapper.appendChild(card);
        }
      }
    })();

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/';
        } else {
          err.textContent = data.message || 'Erro ao fazer login.';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Erro de conexão. Tente novamente.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✦ Entrar';
      }
    }
  </script>
</body>
</html>
