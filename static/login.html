<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central dos Códigos ✦ — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;600;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;600;700&display=swap"/></noscript>
  <style>
    :root {
      --bg-deep:#06000f; --bg-dark:#0d0020; --bg-card:#130029;
      --purple-deep:#3b0764; --purple-mid:#6d28d9; --purple-bright:#a855f7;
      --gold:#f59e0b; --gold-light:#fcd34d;
      --text-white:#f5f0ff; --text-muted:#c4b5fd;
      --border:rgba(168,85,247,0.25); --border-gold:rgba(245,158,11,0.35);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg-deep);color:var(--text-white);font-family:'Raleway',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;}
    .mist{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.12;z-index:0;pointer-events:none;}
    .m1{width:600px;height:600px;background:var(--purple-mid);top:-150px;left:-150px;}
    .m2{width:500px;height:500px;background:var(--gold);bottom:-100px;right:-100px;}
    .card{
      position:relative;z-index:1;
      background:linear-gradient(135deg,rgba(19,0,41,0.95),rgba(26,0,53,0.9));
      border:1px solid var(--border-gold);
      border-radius:20px;padding:48px 40px;width:100%;max-width:420px;
      box-shadow:0 0 60px rgba(109,40,217,0.3),0 0 120px rgba(245,158,11,0.1);
    }
    .logo{text-align:center;margin-bottom:32px;}
    .logo-icon{
      width:80px;height:80px;margin:0 auto 16px;
      background:linear-gradient(135deg,var(--purple-deep),var(--purple-mid));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:36px;border:2px solid var(--border-gold);
      box-shadow:0 0 30px rgba(109,40,217,0.5);
    }
    h1{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;
      background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--purple-bright));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      text-align:center;letter-spacing:0.08em;}
    .subtitle{text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:6px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:0.8rem;font-weight:600;color:var(--text-muted);
      letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
    input{
      width:100%;padding:13px 16px;
      background:rgba(109,40,217,0.1);border:1px solid var(--border);
      border-radius:10px;color:var(--text-white);font-family:'Raleway',sans-serif;font-size:1rem;
      outline:none;transition:border-color .2s,box-shadow .2s;
    }
    input:focus{border-color:var(--purple-bright);box-shadow:0 0 15px rgba(168,85,247,0.3);}
    input::placeholder{color:rgba(196,181,253,0.4);}
    .btn{
      width:100%;padding:14px;margin-top:8px;
      background:linear-gradient(135deg,var(--purple-deep),var(--purple-mid),var(--purple-bright));
      background-size:200% auto;
      border:none;border-radius:10px;color:#fff;
      font-family:'Cinzel',serif;font-size:1rem;font-weight:700;letter-spacing:0.1em;
      cursor:pointer;transition:all .3s;
      box-shadow:0 4px 20px rgba(109,40,217,0.4);
    }
    .btn:hover{background-position:right center;box-shadow:0 6px 30px rgba(109,40,217,0.6);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;}
    .error-msg{
      display:none;margin-top:16px;padding:12px 16px;
      background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.4);
      border-radius:8px;color:#fca5a5;font-size:0.88rem;text-align:center;
    }
    .spinner{
      display:inline-block;width:16px;height:16px;
      border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:8px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .footer-txt{text-align:center;margin-top:24px;color:var(--text-muted);font-size:0.78rem;}
  </style>
</head>
<body>
  <div class="mist m1"></div>
  <div class="mist m2"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1 id="site-title-h1">CENTRAL DOS CÓDIGOS</h1>
      <p class="subtitle">Acesso restrito — faça login para continuar</p>
    </div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">👤 Usuário</label>
        <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">🔒 Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn" id="btn-login">✦ Entrar</button>
    </form>
    <div class="error-msg" id="error-msg"></div>
    <p class="footer-txt">✦ Plataforma exclusiva ✦</p>
  </div>
  <script>
    // ── NOME E IMAGENS DINÂMICAS BASEADOS NO DOMÍNIO ──
    (function() {
      const host = (window.location.hostname || '').toLowerCase();
      const isRios = host.startsWith('rios.') || host.includes('rios.up.railway.app');
      if (isRios) {
        // 1) Injeta CSS customizado tema RIO
        const style = document.createElement('style');
        style.textContent = `
          /* Tema RIO — vermelho/dourado, somente para rios.up.railway.app */
          body { background-color:#0a0000 !important; }
          .card {
            background: linear-gradient(135deg, rgba(30,5,5,0.95), rgba(50,10,10,0.92)) !important;
            border: 1.5px solid rgba(220,38,38,0.55) !important;
            box-shadow: 0 0 60px rgba(220,38,38,0.35), 0 0 120px rgba(245,158,11,0.12), inset 0 0 30px rgba(220,38,38,0.05) !important;
          }
          h1#site-title-h1 {
            background: linear-gradient(135deg, #fcd34d 0%, #f59e0b 30%, #dc2626 70%, #fcd34d 100%) !important;
            background-size: 200% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: rio-shimmer 3s linear infinite;
            text-shadow: 0 0 40px rgba(220,38,38,0.4);
          }
          @keyframes rio-shimmer { to { background-position: 200% center; } }

          .subtitle { color: #fca5a5 !important; }

          /* Labels com ícone vermelho */
          label {
            color: #fcd34d !important;
            font-weight: 700 !important;
            letter-spacing: 0.12em !important;
            text-shadow: 0 1px 4px rgba(220,38,38,0.3);
          }

          /* Inputs estilo RIO — borda vermelha + glow dourado no foco */
          .form-group { position: relative; }
          .form-group input {
            background: rgba(20,5,5,0.85) !important;
            border: 1.5px solid rgba(220,38,38,0.4) !important;
            color: #fef3c7 !important;
            padding: 14px 16px 14px 46px !important;
            font-size: 1.02rem !important;
            font-weight: 500 !important;
            border-radius: 12px !important;
            transition: all .28s ease !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
          }
          .form-group input::placeholder { color: rgba(252,165,165,0.55) !important; font-style: italic; }
          .form-group input:focus {
            border-color: #fcd34d !important;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.25), 0 0 25px rgba(245,158,11,0.35), inset 0 0 10px rgba(220,38,38,0.15) !important;
            background: rgba(30,8,8,0.95) !important;
            outline: none !important;
          }
          /* Ícone dentro do input (esquerda) */
          .rio-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 14px;
            font-size: 1.15rem;
            color: #dc2626;
            text-shadow: 0 0 8px rgba(220,38,38,0.6);
            pointer-events: none;
            transition: all .25s;
            z-index: 2;
          }
          .form-group input:focus + .rio-input-icon,
          .form-group:focus-within .rio-input-icon {
            color: #fcd34d;
            text-shadow: 0 0 12px rgba(245,158,11,0.8);
            transform: translateY(-50%) scale(1.12);
          }

          /* Botão estilo "assalto" RIO */
          .btn {
            background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 35%, #f59e0b 70%, #dc2626 100%) !important;
            background-size: 250% auto !important;
            border: 1.5px solid rgba(252,211,77,0.65) !important;
            color: #fff8e7 !important;
            font-weight: 900 !important;
            letter-spacing: 0.18em !important;
            text-transform: uppercase !important;
            font-size: 1.05rem !important;
            padding: 16px !important;
            margin-top: 14px !important;
            border-radius: 12px !important;
            box-shadow: 0 6px 25px rgba(220,38,38,0.5), 0 0 40px rgba(245,158,11,0.2), inset 0 1px 0 rgba(255,255,255,0.2) !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 12px rgba(220,38,38,0.4);
            transition: all .35s ease !important;
            position: relative;
            overflow: hidden;
          }
          .btn:hover {
            background-position: right center !important;
            box-shadow: 0 8px 35px rgba(220,38,38,0.7), 0 0 60px rgba(245,158,11,0.4), inset 0 1px 0 rgba(255,255,255,0.3) !important;
            transform: translateY(-1px);
            border-color: #fcd34d !important;
          }
          .btn:active { transform: translateY(0); }

          /* Logo icon ja com imagem do Rio — ajusta borda/sombra */
          .logo-icon {
            border: 2.5px solid #fcd34d !important;
            box-shadow: 0 0 35px rgba(220,38,38,0.7), 0 0 70px rgba(245,158,11,0.35), inset 0 0 0 3px #0a0000 !important;
          }

          .footer-txt { color: rgba(252,211,77,0.6) !important; letter-spacing: 0.15em !important; }
          .error-msg {
            background: rgba(220,38,38,0.2) !important;
            border: 1px solid rgba(220,38,38,0.6) !important;
            color: #fca5a5 !important;
          }

          @media (max-width: 480px) {
            .form-group input { padding-left: 44px !important; }
            .rio-input-icon { left: 12px; font-size: 1.05rem; }
          }
        `;
        document.head.appendChild(style);

        // 2) Define título e abas
        const h1 = document.getElementById('site-title-h1');
        if (h1) h1.textContent = 'RIO CÓDIGOS';
        document.title = 'Rio Códigos ✦ — Login';

        // 3) Aplica banner como fundo do body (efeito cinema)
        document.body.style.backgroundImage = "linear-gradient(rgba(10,0,0,0.86), rgba(10,0,0,0.94)), url('/static/rio-bg.jpg')";
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';

        // 4) Substitui o ícone ✦ pela imagem redonda do personagem
        const logoIcon = document.querySelector('.logo-icon');
        if (logoIcon) {
          logoIcon.style.background = "url('/static/rio-icon.jpg') center/cover";
          logoIcon.textContent = '';
        }

        // 5) Adiciona ícones SVG/emoji dentro de cada input
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        if (userInput && !userInput.parentNode.querySelector('.rio-input-icon')) {
          // Limpa o emoji do label e injeta ícone no input
          const userLabel = document.querySelector('label[for="username"]');
          if (userLabel) userLabel.textContent = 'Usuário';
          const ic = document.createElement('span');
          ic.className = 'rio-input-icon';
          ic.textContent = '🎭';
          userInput.parentNode.appendChild(ic);
          userInput.placeholder = 'Digite seu usuário';
        }
        if (passInput && !passInput.parentNode.querySelector('.rio-input-icon')) {
          const passLabel = document.querySelector('label[for="password"]');
          if (passLabel) passLabel.textContent = 'Senha';
          const ic = document.createElement('span');
          ic.className = 'rio-input-icon';
          ic.textContent = '🔑';
          passInput.parentNode.appendChild(ic);
          passInput.placeholder = 'Digite sua senha';
        }

        // 6) Botão entrar com ícone de cofre/máscara
        const btn = document.getElementById('btn-login');
        if (btn) btn.innerHTML = '🎭 Entrar no Cofre';

        // 7) Adiciona banner pequeno acima do card — envolvendo em wrapper centralizado
        const card = document.querySelector('.card');
        if (card && !document.getElementById('rio-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'rio-wrapper';
          wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;margin:0 auto;position:relative;z-index:1;';
          const banner = document.createElement('div');
          banner.id = 'rio-banner';
          banner.style.cssText = 'width:100%;margin:0 0 14px 0;border-radius:14px;overflow:hidden;border:1px solid rgba(245,158,11,0.4);box-shadow:0 0 30px rgba(220,38,38,0.4);';
          banner.innerHTML = '<img src="/static/rio-banner-1200.jpg" alt="RIO" style="width:100%;display:block"/>';
          card.parentNode.insertBefore(wrapper, card);
          wrapper.appendChild(banner);
          wrapper.appendChild(card);
        }
      }

      // ── TEMA STREAM ROGER (vermelho/laranja/amarelo/azul elétrico) ──
      const isRoger = host.startsWith('roger.') || host.includes('roger.up.railway.app') || host.includes('-roger') || host.includes('roger-');
      if (isRoger) {
        const style = document.createElement('style');
        style.textContent = `
          /* Tema STREAM ROGER — cores vibrantes */
          body { background-color:#000308 !important; }
          .card {
            background: linear-gradient(135deg, rgba(0,10,30,0.94), rgba(20,5,10,0.92)) !important;
            border: 2px solid rgba(255,215,0,0.5) !important;
            box-shadow:
              0 0 60px rgba(33,150,243,0.45),
              0 0 120px rgba(255,56,56,0.15),
              inset 0 0 30px rgba(33,150,243,0.06) !important;
          }
          h1#site-title-h1 {
            background: linear-gradient(135deg, #ff3838 0%, #ff8c00 22%, #ffd700 44%, #2196f3 70%, #0066ff 100%) !important;
            background-size: 250% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: roger-shimmer 4s linear infinite;
            text-shadow: 0 0 40px rgba(33,150,243,0.45);
            letter-spacing: 0.22em !important;
          }
          @keyframes roger-shimmer { to { background-position: 250% center; } }

          .subtitle { color: #a0d8ff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

          label {
            color: #ffd700 !important;
            font-weight: 700 !important;
            letter-spacing: 0.12em !important;
            text-shadow: 0 1px 4px rgba(33,150,243,0.35);
          }

          .form-group { position: relative; }
          .form-group input {
            background: rgba(0,8,25,0.85) !important;
            border: 2px solid rgba(33,150,243,0.5) !important;
            color: #ffffff !important;
            padding: 14px 16px 14px 46px !important;
            font-size: 1.02rem !important;
            font-weight: 500 !important;
            border-radius: 12px !important;
            transition: all .28s ease !important;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
          }
          .form-group input::placeholder { color: rgba(160,216,255,0.55) !important; font-style: italic; }
          .form-group input:focus {
            border-color: #ffd700 !important;
            box-shadow: 0 0 0 4px rgba(255,215,0,0.2), 0 0 28px rgba(255,140,0,0.45), inset 0 0 12px rgba(33,150,243,0.15) !important;
            background: rgba(0,15,40,0.92) !important;
            outline: none !important;
          }
          .roger-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 14px;
            font-size: 1.2rem;
            color: #2196f3;
            text-shadow: 0 0 10px rgba(33,150,243,0.7);
            pointer-events: none;
            transition: all .25s;
            z-index: 2;
          }
          .form-group input:focus + .roger-input-icon,
          .form-group:focus-within .roger-input-icon {
            color: #ffd700;
            text-shadow: 0 0 14px rgba(255,215,0,0.85);
            transform: translateY(-50%) scale(1.15);
          }

          .btn {
            background: linear-gradient(135deg, #b91c1c 0%, #ea580c 25%, #ffd700 50%, #2196f3 75%, #0066ff 100%) !important;
            background-size: 280% auto !important;
            border: 2px solid #ffd700 !important;
            color: #fff !important;
            font-weight: 900 !important;
            letter-spacing: 0.18em !important;
            text-transform: uppercase !important;
            font-size: 1.05rem !important;
            padding: 16px !important;
            margin-top: 14px !important;
            border-radius: 12px !important;
            box-shadow:
              0 6px 25px rgba(33,150,243,0.55),
              0 0 45px rgba(255,140,0,0.3),
              inset 0 1px 0 rgba(255,255,255,0.25) !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.75), 0 0 14px rgba(33,150,243,0.45);
            transition: all .35s ease !important;
            animation: roger-btn-shimmer 5s linear infinite;
            position: relative;
            overflow: hidden;
          }
          @keyframes roger-btn-shimmer { to { background-position: 280% center; } }
          .btn:hover {
            box-shadow: 0 10px 40px rgba(255,215,0,0.7), 0 0 70px rgba(33,150,243,0.55), inset 0 1px 0 rgba(255,255,255,0.35) !important;
            transform: translateY(-2px);
          }
          .btn:active { transform: translateY(0); }

          .logo-icon {
            border: 3px solid #ffd700 !important;
            box-shadow:
              0 0 35px rgba(33,150,243,0.7),
              0 0 70px rgba(255,56,56,0.4),
              0 0 110px rgba(255,140,0,0.25),
              inset 0 0 0 3px #000 !important;
            background: url('/static/roger-icon.jpg') center/cover !important;
            background-size: 130% !important;
          }

          .footer-txt { color: rgba(255,215,0,0.65) !important; letter-spacing: 0.15em !important; }
          .error-msg {
            background: rgba(185,28,28,0.22) !important;
            border: 1.5px solid rgba(255,56,56,0.6) !important;
            color: #ffb8b8 !important;
          }

          #roger-banner {
            width:100%; margin:0 0 14px 0;
            border-radius:14px; overflow:hidden;
            border:1.5px solid rgba(255,215,0,0.5);
            box-shadow: 0 0 35px rgba(33,150,243,0.45), 0 0 70px rgba(255,140,0,0.2);
          }

          @media (max-width: 480px) {
            .form-group input { padding-left: 44px !important; }
            .roger-input-icon { left: 12px; font-size: 1.1rem; }
          }
        `;
        document.head.appendChild(style);

        // Título e tab
        const h1 = document.getElementById('site-title-h1');
        if (h1) h1.textContent = 'STREAM ROGER';
        document.title = 'Stream Roger ✨ — Login';

        // Fundo cinematográfico
        document.body.style.backgroundImage = "linear-gradient(rgba(0,3,8,0.88), rgba(0,5,15,0.94)), url('/static/roger-bg.jpg')";
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';

        // Substitui o ícone
        const logoIcon = document.querySelector('.logo-icon');
        if (logoIcon) { logoIcon.style.background = "url('/static/roger-icon.jpg') center/cover"; logoIcon.textContent = ''; }

        // Ícones nos inputs
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        if (userInput && !userInput.parentNode.querySelector('.roger-input-icon')) {
          const userLabel = document.querySelector('label[for="username"]');
          if (userLabel) userLabel.textContent = 'Usuário';
          const ic = document.createElement('span');
          ic.className = 'roger-input-icon';
          ic.textContent = '👤';
          userInput.parentNode.appendChild(ic);
          userInput.placeholder = 'Digite seu usuário';
        }
        if (passInput && !passInput.parentNode.querySelector('.roger-input-icon')) {
          const passLabel = document.querySelector('label[for="password"]');
          if (passLabel) passLabel.textContent = 'Senha';
          const ic = document.createElement('span');
          ic.className = 'roger-input-icon';
          ic.textContent = '🔐';
          passInput.parentNode.appendChild(ic);
          passInput.placeholder = 'Digite sua senha';
        }

        // Botão de entrar
        const btn = document.getElementById('btn-login');
        if (btn) btn.innerHTML = '✨ Entrar';

        // Banner acima do card
        const card = document.querySelector('.card');
        if (card && !document.getElementById('roger-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'roger-wrapper';
          wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;margin:0 auto;position:relative;z-index:1;';
          const banner = document.createElement('div');
          banner.id = 'roger-banner';
          banner.innerHTML = '<img src="/static/roger-banner-1200.jpg" alt="STREAM ROGER" style="width:100%;display:block"/>';
          card.parentNode.insertBefore(wrapper, card);
          wrapper.appendChild(banner);
          wrapper.appendChild(card);
        }
      }

      // ── TEMA JMP (ciano + magenta neon) ──
      const isJmp = host.startsWith('jmp.') || host.includes('jmp.up.railway.app') || host.includes('-jmp') || host.includes('jmp-');
      if (isJmp) {
        const style = document.createElement('style');
        style.textContent = `
          /* Tema JMP — ciano neon + magenta vibrante */
          body { background-color:#02030a !important; }
          .card {
            background: linear-gradient(135deg, rgba(0,15,40,0.94), rgba(15,0,20,0.92)) !important;
            border: 2px solid rgba(0,229,255,0.55) !important;
            box-shadow:
              0 0 60px rgba(0,229,255,0.5),
              0 0 120px rgba(255,20,147,0.2),
              inset 0 0 30px rgba(0,229,255,0.06) !important;
          }
          h1#site-title-h1 {
            background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 22%, #ffffff 50%, #ff1493 78%, #ff6ec7 100%) !important;
            background-size: 260% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            animation: jmp-shimmer 4s linear infinite;
            text-shadow: 0 0 40px rgba(0,229,255,0.5);
            letter-spacing: 0.32em !important;
          }
          @keyframes jmp-shimmer { to { background-position: 260% center; } }

          .subtitle { color: #a0e8ff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }

          label {
            color: #00e5ff !important;
            font-weight: 700 !important;
            letter-spacing: 0.12em !important;
            text-shadow: 0 1px 4px rgba(0,229,255,0.35);
          }

          .form-group { position: relative; }
          .form-group input {
            background: rgba(0,8,25,0.85) !important;
            border: 2px solid rgba(0,229,255,0.5) !important;
            color: #ffffff !important;
            padding: 14px 16px 14px 46px !important;
            font-size: 1.02rem !important;
            font-weight: 500 !important;
            border-radius: 12px !important;
            transition: all .28s ease !important;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
          }
          .form-group input::placeholder { color: rgba(160,232,255,0.5) !important; font-style: italic; }
          .form-group input:focus {
            border-color: #ff1493 !important;
            box-shadow: 0 0 0 4px rgba(255,20,147,0.2), 0 0 28px rgba(0,229,255,0.5), inset 0 0 12px rgba(0,229,255,0.15) !important;
            background: rgba(0,15,40,0.92) !important;
            outline: none !important;
          }
          .jmp-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 14px;
            font-size: 1.2rem;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0,229,255,0.75);
            pointer-events: none;
            transition: all .25s;
            z-index: 2;
          }
          .form-group input:focus + .jmp-input-icon,
          .form-group:focus-within .jmp-input-icon {
            color: #ff1493;
            text-shadow: 0 0 14px rgba(255,20,147,0.85);
            transform: translateY(-50%) scale(1.15);
          }

          .btn {
            background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 25%, #ffffff 50%, #ff1493 75%, #c2185b 100%) !important;
            background-size: 280% auto !important;
            border: 2px solid #00e5ff !important;
            color: #000 !important;
            font-weight: 900 !important;
            letter-spacing: 0.18em !important;
            text-transform: uppercase !important;
            font-size: 1.05rem !important;
            padding: 16px !important;
            margin-top: 14px !important;
            border-radius: 12px !important;
            box-shadow:
              0 6px 25px rgba(0,229,255,0.55),
              0 0 45px rgba(255,20,147,0.3),
              inset 0 1px 0 rgba(255,255,255,0.4) !important;
            text-shadow: 0 1px 2px rgba(255,255,255,0.3);
            transition: all .35s ease !important;
            animation: jmp-btn-shimmer 5s linear infinite;
            position: relative;
            overflow: hidden;
          }
          @keyframes jmp-btn-shimmer { to { background-position: 280% center; } }
          .btn:hover {
            box-shadow: 0 10px 40px rgba(255,20,147,0.7), 0 0 70px rgba(0,229,255,0.55), inset 0 1px 0 rgba(255,255,255,0.5) !important;
            transform: translateY(-2px);
          }
          .btn:active { transform: translateY(0); }

          .logo-icon {
            border: 3px solid #00e5ff !important;
            box-shadow:
              0 0 35px rgba(0,229,255,0.75),
              0 0 70px rgba(255,20,147,0.4),
              0 0 110px rgba(0,229,255,0.25),
              inset 0 0 0 3px #02030a !important;
            background: url('/static/jmp-icon.jpg') center/cover !important;
            background-size: 130% !important;
          }

          .footer-txt { color: rgba(0,229,255,0.65) !important; letter-spacing: 0.15em !important; }
          .error-msg {
            background: rgba(255,20,147,0.18) !important;
            border: 1.5px solid rgba(255,20,147,0.6) !important;
            color: #ffb8d5 !important;
          }

          #jmp-banner {
            width:100%; margin:0 0 14px 0;
            border-radius:14px; overflow:hidden;
            border:1.5px solid rgba(0,229,255,0.55);
            box-shadow: 0 0 35px rgba(0,229,255,0.5), 0 0 70px rgba(255,20,147,0.25);
          }

          @media (max-width: 480px) {
            .form-group input { padding-left: 44px !important; }
            .jmp-input-icon { left: 12px; font-size: 1.1rem; }
          }
        `;
        document.head.appendChild(style);

        const h1 = document.getElementById('site-title-h1');
        if (h1) h1.textContent = 'JMP';
        document.title = 'JMP ✨ — Login';

        document.body.style.backgroundImage = "linear-gradient(rgba(2,3,10,0.88), rgba(5,0,15,0.94)), url('/static/jmp-bg.jpg')";
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';

        const logoIcon = document.querySelector('.logo-icon');
        if (logoIcon) { logoIcon.style.background = "url('/static/jmp-icon.jpg') center/cover"; logoIcon.textContent = ''; }

        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        if (userInput && !userInput.parentNode.querySelector('.jmp-input-icon')) {
          const userLabel = document.querySelector('label[for="username"]');
          if (userLabel) userLabel.textContent = 'Usuário';
          const ic = document.createElement('span');
          ic.className = 'jmp-input-icon';
          ic.textContent = '👤';
          userInput.parentNode.appendChild(ic);
          userInput.placeholder = 'Digite seu usuário';
        }
        if (passInput && !passInput.parentNode.querySelector('.jmp-input-icon')) {
          const passLabel = document.querySelector('label[for="password"]');
          if (passLabel) passLabel.textContent = 'Senha';
          const ic = document.createElement('span');
          ic.className = 'jmp-input-icon';
          ic.textContent = '🔐';
          passInput.parentNode.appendChild(ic);
          passInput.placeholder = 'Digite sua senha';
        }

        const btn = document.getElementById('btn-login');
        if (btn) btn.innerHTML = '✨ Entrar';

        const card = document.querySelector('.card');
        if (card && !document.getElementById('jmp-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'jmp-wrapper';
          wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;margin:0 auto;position:relative;z-index:1;';
          const banner = document.createElement('div');
          banner.id = 'jmp-banner';
          banner.innerHTML = '<img src="/static/jmp-banner-1200.jpg" alt="JMP" style="width:100%;display:block"/>';
          card.parentNode.insertBefore(wrapper, card);
          wrapper.appendChild(banner);
          wrapper.appendChild(card);
        }

        // ── BOTÃO WHATSAPP FLUTUANTE (apenas no login JMP) ──
        if (!document.getElementById('jmp-whatsapp-btn')) {
          const waNumber = '5519999943116'; // Brasil +55 + 19 + 999943116
          const waMessage = encodeURIComponent('Olá! Vim pelo site JMP e gostaria de mais informações.');
          const waStyle = document.createElement('style');
          waStyle.textContent = `
            #jmp-whatsapp-btn {
              position: fixed;
              bottom: 24px;
              right: 24px;
              z-index: 9999;
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 14px 20px 14px 16px;
              background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
              color: #fff;
              text-decoration: none;
              border-radius: 50px;
              font-family: 'Raleway', sans-serif;
              font-weight: 700;
              font-size: 15px;
              letter-spacing: 0.04em;
              box-shadow:
                0 6px 24px rgba(37,211,102,0.55),
                0 0 35px rgba(0,229,255,0.35),
                0 0 60px rgba(255,20,147,0.25),
                inset 0 1px 0 rgba(255,255,255,0.3);
              border: 2px solid rgba(0,229,255,0.5);
              transition: all 0.3s ease;
              animation: jmp-wa-pulse 2.4s ease-in-out infinite;
            }
            #jmp-whatsapp-btn:hover {
              transform: translateY(-3px) scale(1.05);
              box-shadow:
                0 10px 35px rgba(37,211,102,0.75),
                0 0 50px rgba(0,229,255,0.55),
                0 0 80px rgba(255,20,147,0.4),
                inset 0 1px 0 rgba(255,255,255,0.4);
              border-color: #ff1493;
            }
            #jmp-whatsapp-btn svg {
              width: 26px;
              height: 26px;
              fill: #fff;
              filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
            }
            #jmp-whatsapp-btn .wa-text {
              white-space: nowrap;
              text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            }
            @keyframes jmp-wa-pulse {
              0%, 100% {
                box-shadow:
                  0 6px 24px rgba(37,211,102,0.55),
                  0 0 35px rgba(0,229,255,0.35),
                  0 0 60px rgba(255,20,147,0.25),
                  inset 0 1px 0 rgba(255,255,255,0.3);
              }
              50% {
                box-shadow:
                  0 6px 28px rgba(37,211,102,0.75),
                  0 0 55px rgba(0,229,255,0.55),
                  0 0 90px rgba(255,20,147,0.4),
                  inset 0 1px 0 rgba(255,255,255,0.4);
              }
            }
            @media (max-width: 600px) {
              #jmp-whatsapp-btn {
                bottom: 16px;
                right: 16px;
                padding: 12px 16px 12px 14px;
                font-size: 14px;
              }
              #jmp-whatsapp-btn svg { width: 22px; height: 22px; }
            }
          `;
          document.head.appendChild(waStyle);

          const waBtn = document.createElement('a');
          waBtn.id = 'jmp-whatsapp-btn';
          waBtn.href = `https://wa.me/${waNumber}?text=${waMessage}`;
          waBtn.target = '_blank';
          waBtn.rel = 'noopener noreferrer';
          waBtn.title = 'Falar no WhatsApp: (19) 99994-3116';
          waBtn.innerHTML = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.6"/>
            </svg>
            <span class="wa-text">WhatsApp</span>
          `;
          document.body.appendChild(waBtn);
        }
      }
    })();

    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/';
        } else {
          err.textContent = data.message || 'Erro ao fazer login.';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Erro de conexão. Tente novamente.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '✦ Entrar';
      }
    }
  </script>
</body>
