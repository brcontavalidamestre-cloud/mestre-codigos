<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Central · Admin Extra</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#091321;color:#eff8ff;font:16px system-ui,sans-serif}main{max-width:780px;margin:48px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1,h2,p{margin:.4em 0}.tag{color:#9feadd;text-transform:uppercase;font-size:.75rem;letter-spacing:.13em}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}button,select{font:inherit;color:inherit;border:1px solid #3c5a72;border-radius:10px;background:#153047;padding:10px;max-width:100%}button{cursor:pointer}.card{min-height:104px;text-align:left;background:#15253b;display:grid;gap:6px;padding:16px}.card[aria-pressed=true]{border-color:#8df5dc;background:#173d48}.panel{margin-top:18px;border:1px solid #324e66;border-radius:14px;background:#102034;padding:16px}label{display:block;margin:10px 0}small,p{color:#adc6d8}li{padding:8px 0;overflow-wrap:anywhere}button:focus-visible,select:focus-visible{outline:2px solid #a5ffeb;outline-offset:3px}</style><script src="/static/admin-extra.js?v=1" defer></script></head><body><main><header><div><span class="tag">Central · Acesso restrito</span><h1>Admin Extra</h1></div><button id="logout">Sair</button></header><nav class="grid" aria-label="Opções do Admin Extra"><button class="card" id="query" aria-pressed="true"><strong>🔎 Consultar recebimento</strong><small>Veja se chegou uma mensagem para um e-mail vinculado.</small></button><button class="card" id="inbox" aria-pressed="false"><strong>📥 Caixa de Entrada</strong><small>Acompanhe os recebimentos recentes.</small></button></nav><section class="panel"><h2 id="title">Consultar recebimento</h2><p>Somente e-mails vinculados a este perfil · últimos 15 minutos.</p><label>E-mail vinculado <select id="email"></select></label><button id="refresh" disabled>Atualizar agora</button><p id="status" role="status" aria-live="polite">Carregando…</p><ul id="items"></ul></section></main></body></html>
