<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bandeja individual · Central</title><link rel="stylesheet" href="/static/inbox-modern.css?v=2"><style>body{background:#091320;margin:0}.shell{max-width:850px;margin:32px auto;padding:0 16px}.box{padding:20px;border:1px solid var(--ib-border);background:var(--ib-panel);border-radius:16px}input,button{box-sizing:border-box;padding:10px;border:1px solid #38516a;border-radius:8px;color:inherit;background:#0d1c2e;font:inherit}label{display:block;margin:12px 0}input{display:block;width:min(100%,400px);margin-top:5px}button{cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button:first-child,form button{background:#99eee2;color:#102034;font-weight:700}h1{font-size:1.45rem}.bd-table{min-width:0!important}#status{color:var(--ib-muted)}</style><script src="/static/extra-inbox.js?v=2" defer></script></head><body class="central-inbox-modern"><main class="shell"><section class="box"><span class="ib-eyebrow">Central · Bandeja individual</span><h1>📨 E-mails recebidos em tempo real</h1><form id="login"><label>E-mail<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>Entrar</button></form><div id="tray" hidden><p id="address"></p><p>Últimos 15 minutos · atualização automática a cada 12 segundos</p><div class="toolbar"><button type="button" id="refresh">Atualizar agora</button><button type="button" id="logout">Sair</button></div><br><div class="bd-table-scroll"><table class="bd-table"><thead><tr><th scope="col">Filtro</th><th scope="col">Mensagem</th><th scope="col">Data</th></tr></thead><tbody id="rows"></tbody></table></div></div><p id="status" role="status" aria-live="polite"></p></section></main></body></html>
