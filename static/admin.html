<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Mestre Códigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#06000f;color:#fff;font-family:Raleway,sans-serif;padding:24px}
    .wrap{max-width:980px;margin:0 auto}.card{background:linear-gradient(135deg,rgba(19,0,41,.96),rgba(26,0,53,.96));border:1px solid rgba(245,158,11,.35);border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
    h1{margin:0 0 10px;font-family:Cinzel,serif;font-size:2rem;background:linear-gradient(135deg,#fcd34d,#f59e0b,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    p{color:#c4b5fd} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(168,85,247,.25);background:rgba(59,7,100,.2);color:#fff;outline:none}
    .btn{padding:13px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,#6d28d9,#3b0764);color:#fff;font-weight:700;cursor:pointer}.btn.red{background:linear-gradient(135deg,#b91c1c,#7f1d1d)} .btn.gold{background:linear-gradient(135deg,#f59e0b,#b45309)}
    table{width:100%;border-collapse:collapse;margin-top:16px} th,td{padding:12px 10px;border-bottom:1px solid rgba(168,85,247,.18);text-align:left} th{color:#fcd34d} .msg{display:none;margin-top:12px;padding:12px;border-radius:12px}.ok{display:block;background:rgba(20,83,45,.35);border:1px solid rgba(74,222,128,.35);color:#bbf7d0}.err{display:block;background:rgba(127,29,29,.35);border:1px solid rgba(248,113,113,.35);color:#fecaca}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <h1>Painel Admin</h1>
          <p>Gerencie usuários do sistema.</p>
        </div>
        <button class="btn gold" onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="card">
      <h3>Criar usuário</h3>
      <div class="grid">
        <input class="input" id="name" placeholder="Nome">
        <input class="input" id="username" placeholder="Usuário">
        <input class="input" id="password" placeholder="Senha">
        <select id="role"><option value="client">Cliente</option><option value="admin">Admin</option></select>
      </div>
      <div style="margin-top:12px"><button class="btn" onclick="createUser()">Criar usuário</button></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <h3>Usuários</h3>
      <table>
        <thead><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Ações</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script>
    function show(type,text){const el=document.getElementById('msg'); el.className='msg '+type; el.textContent=text}
    async function loadUsers(){
      const res=await fetch('/api/admin/users'); const data=await res.json();
      if(!data.success){location.href='/'; return}
      const tbody=document.getElementById('tbody'); tbody.innerHTML='';
      data.users.forEach(u=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${u.username}</td><td>${u.name||''}</td><td>${u.role}</td><td><button class="btn red" onclick="removeUser('${u.username}')">Excluir</button></td>`;
        tbody.appendChild(tr);
      });
    }
    async function createUser(){
      const name=document.getElementById('name').value.trim();
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value.trim();
      const role=document.getElementById('role').value;
      const res=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,username,password,role})});
      const data=await res.json();
      if(data.success){show('ok',data.message||'Usuário criado.'); document.getElementById('name').value=''; document.getElementById('username').value=''; document.getElementById('password').value=''; loadUsers();}
      else show('err',data.message||'Falha ao criar usuário.');
    }
    async function removeUser(username){
      if(!confirm('Excluir '+username+'?')) return;
      const res=await fetch('/api/admin/users/'+encodeURIComponent(username),{method:'DELETE'}); const data=await res.json();
      if(data.success){show('ok',data.message||'Usuário removido.'); loadUsers();} else show('err',data.message||'Falha ao remover.');
    }
    async function logout(){ await fetch('/api/auth/logout',{method:'POST'}); location.href='/login'; }
    loadUsers();
  </script>
</body>
</html>
